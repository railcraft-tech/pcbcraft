# Korekty płytki longfred-v1a. Wygrywają z bazą kicad-jlcpcb-tools.
#
# rotation: stopnie dodawane do kąta KiCada, już po odbiciu spodu.
#   liczba dodatnia — w lewo (przeciwnie do zegara)
#   liczba ujemna — w prawo
# x, y: milimetry w osiach pliku pozycji (X w prawo, Y w górę).
#   To różnica środka części. Nie obraca się razem z nią.
# Pominięte pole oznacza zero.
#
# ref — dokładne oznaczenie, wygrywa z footprintem.
# footprint — nazwa footprintu. SOT-23 pasuje też do SOT-23-3,
#   SOT-23-5 i SOT-23-6. Granicą jest koniec nazwy, „-” albo „_”,
#   więc SOT-223 już nie.

transformations:
  - ref: U1
    rotation: 0

  - ref: J3
    rotation: 0
    x: -0.66

  # SOT-23-5
  - ref: [U7]
    rotation: -180

  # SOT-23-3P
  - ref: [Q1, Q2, Q3, Q4]
    rotation: -180

  #  USB-C (J1, USB4105)
  - footprint: USB
    x: 1.24

  - ref: J2
    x: -1.09

  - ref: J10
    x: -1.34

  - ref: J4
    y: -0.5

  # Joystick
  - ref: J6
    rotation: 180

  - ref: U4
    rotation: -90
