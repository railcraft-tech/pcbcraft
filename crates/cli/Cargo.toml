[package]
name = "pcbcraft"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true
description = "PCB export, checks, and ordering helper"

[[bin]]
name = "pcbcraft"
path = "src/main.rs"

[dependencies]
pcbcraft-application = { path = "../application" }
pcbcraft-domain = { path = "../domain" }
pcbcraft-kicad = { path = "../kicad" }
pcbcraft-render = { path = "../render" }
pcbcraft-suppliers = { path = "../suppliers" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
